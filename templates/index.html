<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Melo AI | Job Interview Questions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <!-- header -->
    <header class="head">
      <span class="head-logo">Melo AI</span>
      <div class="head-rule"></div>
      <span class="head-date" id="current-date"></span>
    </header>

    <!-- main container -->
    <main class="page">
      <!-- hero section -->
      <section class="hero">
        <p class="hero-kicker">AI-powered hiring toolkit</p>
        <h1>Ask the<br /><em>right</em> questions.</h1>
        <p class="hero-sub">Enter any job title and get three precise, role-specific interview questions crafted by AI • ready to use in your next interview.</p>
      </section>

      <!-- ornament divider -->
      <div class="ornament">
        <div class="ornament-line"></div>
        <span class="ornament-glyph">✦</span>
        <div class="ornament-line"></div>
      </div>

      <!-- form section -->
      <section class="form-section">
        <label for="job-title-input" class="input-label">Job Title</label>
        <div class="input-row">
          <input
            id="job-title-input"
            type="text"
            placeholder="e.g. Customer Success Manager"
            maxlength="100"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="submit-btn" type="button">Generate 🗲<</button>
        </div>

        <!-- loading indicator -->
        <div id="loader">
          <div class="loader-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="loader-text">Crafting questions&hellip;</span>
        </div>

        <!-- error message -->
        <div id="error-box" role="alert"></div>
      </section>
    </main>

    <footer class="page footer">
      <span>Powered by Google Gemini</span>
      <span>Melo AI &copy; <span id="footer-year"></span></span>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
